<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gran Galoppo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#0F2A21;--panel:#163A2D;--line:#24523F;--line2:#2F6A50;--btn:#1C4535;--text:#F3EEDF;--muted:#B9C4B5;--gold:#D4AF37;--warn:#F0B4A6;--ok:#86C98A;--note:#E9D9A6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
#wrap{width:1280px;height:840px;transform-origin:top center}
#app{width:1280px;height:840px;padding:20px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
button{font-family:inherit;color:var(--text);cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.mono{font-family:'IBM Plex Mono',monospace}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.cap{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.gold{color:var(--gold)}
.primary{border:0;border-radius:8px;background:var(--gold);color:#1C1606;font-weight:600}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:10px;text-align:left}
.sel.on{border-color:var(--gold);background:var(--line)}
.dark.sel{background:var(--bg)}
.dark.sel.on{background:var(--line)}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar>div{height:100%}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 20px}
.tab{min-height:44px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:15px;font-weight:600}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1C1606}
.act{min-height:64px;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--btn);text-align:left;display:flex;flex-direction:column;gap:3px}
.horsebox{border-radius:10px;background:#2C5A3F;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:15px}
th{padding:8px 6px;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.08em;text-align:left}
td{padding:12px 6px;border-top:1px solid var(--line)}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;border-width:3px;border-style:solid;vertical-align:middle}
.abs{position:absolute}
.pace{flex:1;min-height:48px;border-radius:8px;border:1px solid var(--line2);background:var(--btn);font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pace.on{background:var(--gold);border-color:var(--gold);color:#1C1606}
.pace small{font-size:11px;font-weight:500;opacity:.8}
.lanebtn{width:52px;min-height:48px;border-radius:8px;border:1px solid var(--line2);background:var(--btn);display:flex;align-items:center;justify-content:center}
.scroll{overflow-y:auto;min-height:0}
</style>
</head>
<body>
<div id="wrap"><div id="app"></div></div>

/* ---------- Azioni di gestione ---------- */

function openBook(lvl, mode) {

function startRace() {
  var b = S.book; if (!b) return;
  var run = b.mode === 'run';
  var lv = LEVELS[b.lvl - 1];
  if (run) {
    if (raceCheck()) { sfx('error'); S.msg = raceCheck(); render(); return; }
    var j = JOCKEYS[S.jockey];
    S.money -= lv.fee + j.cost;
    updateHorse(selHorse().id, function (x) { x.raced = true; return x; });
  } else {
    S.watched[b.lvl] = S.week;
  }
  var lanes = [0, 1, 2, 3, 4, 5].sort(function () { return Math.random() - 0.5; });
  var backed = {};
  b.bets.forEach(function (bet) { bet.sel.forEach(function (i) { backed[i] = true; }); });
  var racers = b.runners.map(function (r, i) {
    return Object.assign({}, r, { day: 1 + gauss() * DAY_SD, id: r.stableId + i, idx: i, lane: lanes[i], pos: 0, speed: 0, stam: 100, pace: 1, phase: Math.random(), finished: false, time: 0, backed: !!backed[i], num: String(r.num) });
  });
  racers.sort(function (a, c) { return (c.isPlayer ? 1 : 0) - (a.isPlayer ? 1 : 0); });
  var items = [];
  if (run && D().power) {
    for (var m = 140; m < lv.dist - 80; m += ri(90, 150)) {
      var roll = Math.random();
      items.push({ m: m, lane: ri(0, 5), kind: roll < 0.45 ? 'carota' : (roll < 0.8 ? 'zolletta' : 'ferro'), taken: false });
    }
  }
  S.race = { lvl: lv.id, dist: lv.dist, t: 0, count: 3.6, racers: racers, items: items, boostUntil: 0, ironUntil: 0, done: false, results: null, toast: '', toastUntil: 0, playerDone: false, playerDoneT: 0, spectator: !run, rate: DT / 0.05 };
  S.screen = 'race'; lastCount = 4;

}
function racePlayer(race) { return race.racers[0] && race.racers[0].isPlayer ? race.racers[0] : null; }
function raceFocus(race) {
  var p = racePlayer(race); if (p) return p;
  var best = race.racers[0];
  race.racers.forEach(function (r) { if (r.pos > best.pos) best = r; });
  return best;
}
function steer(d) {
  var sign = window.Race3D && Race3D.laneSign ? Race3D.laneSign() : 1;
  moveLane(sign * d);
}
function setPace(p) { var r = S.race; if (!r || r.done || r.spectator || r.racers[0].finished) return; r.racers[0].pace = p; updateRace(); }
function moveLane(d) { var r = S.race; if (!r || r.done || r.spectator || r.racers[0].finished) return; r.racers[0].lane = clamp(r.racers[0].lane + d, 0, 5); updateRace(); }

function tick() {
  var race = S.race;
  if (S.screen !== 'race' || !race || race.done) return;
  if (race.count > 0) {
    race.count -= 0.05;
    var c = Math.ceil(race.count);
    if (c !== lastCount && c <= 3) { lastCount = c; if (c > 0) sfx('beep'); }
    if (race.count <= 0) { sfx('go'); crowdStart(); }
    updateRace(); return;
  }
  var me = racePlayer(race), focus = raceFocus(race);
  race.tickAt = performance.now();
  var steps = race.playerDone ? 3 : 1;
  for (var n = 0; n < steps; n++) {
    race.t += DT;
    var prev = me ? me.pos : 0;
    race.racers.forEach(function (x) { stepRacer(x, race, DT); });
    if (me) race.items.forEach(function (it) {
      if (!it.taken && it.lane === me.lane && prev < it.m && me.pos >= it.m && !me.finished) {
        it.taken = true; sfx('power');
        if (it.kind === 'carota') { me.stam = Math.min(100, me.stam + 30); race.toast = 'Carota. Fiato +30'; }
        if (it.kind === 'zolletta') { race.boostUntil = race.t + 10; race.toast = 'Zolletta di zucchero. Scatto!'; }
        if (it.kind === 'ferro') { race.ironUntil = race.t + 15; race.toast = 'Ferro d’oro. Fiato illimitato'; }
        race.toastUntil = race.t + 4;
      }
    });
    var doneNow = me ? me.finished : race.racers.some(function (r) { return r.finished; });
    if (doneNow && !race.playerDone) { race.playerDone = true; race.playerDoneT = race.t; crowdLevel(0.09); }
  }
  race.racers.forEach(function (r) { r.phase += 0.05 * (r.finished ? 1.6 : 2.4) * (0.4 + r.speed / 18); });
  focus = raceFocus(race);
  var stride = Math.floor(focus.phase);
  if (stride !== lastStride && !focus.finished && focus.speed > 2) {
    lastStride = stride;
    var per = 1 / (2.4 * (0.4 + focus.speed / 18));
    thump(0, 0.22); thump(per * 0.14, 0.18); thump(per * 0.28, 0.26);
  }
  if (!race.playerDone) crowdLevel(0.015 + 0.06 * Math.pow(focus.pos / race.dist, 2));
  var allDone = race.racers.every(function (r) { return r.finished; });
  if (allDone || (race.playerDone && race.t - race.playerDoneT > 40)) { finishRace(race); return; }
  updateRace();
}
function finishRace(race) {
  var lv = LEVELS[race.lvl - 1];
  var order = orderOf(race);
  var me = racePlayer(race);
  order.forEach(function (r, i) { S.stables[r.stableId] = (S.stables[r.stableId] || 0) + POINTS[i]; if (i === 0) S.swins[r.stableId] = (S.swins[r.stableId] || 0) + 1; });
  var winner = order[0];
  if (winner.finished && (!S.records[lv.id] || winner.time < S.records[lv.id].time)) S.records[lv.id] = { time: winner.time, horse: winner.name };
  var place = 0, prize = 0;
  if (me) {
    place = order.indexOf(me) + 1;
    prize = Math.round(lv.prize * PRIZE_SHARE[place - 1] * D().prize);
    updateHorse(S.selId, function (x) {
      x.energy = Math.max(0, x.energy - 35);
      x.morale = clamp(x.morale + (place === 1 ? 15 : place <= 3 ? 6 : -5), 0, 100);
      x.starts += 1; if (place === 1) x.wins += 1; x.earnings += prize;
      x.form = [place].concat(x.form || []).slice(0, 5); return x;
    });
    if (!S.best[lv.id] || place < S.best[lv.id]) S.best[lv.id] = place;
    var note = '';
    if (place <= 3 && lv.id === S.unlocked && S.unlocked < LEVELS.length) { S.unlocked += 1; note = ' Hai sbloccato il livello ' + S.unlocked + '.'; }
    S.career = { starts: S.career.starts + 1, wins: S.career.wins + (place === 1 ? 1 : 0), earn: S.career.earn + prize };
    S.money += prize;
    race.title = place === 1 ? 'Vittoria!' : place + '° posto';
    race.note = (prize > 0 ? 'Premio ' + euro(prize) + '. ' : 'Nessun premio questa volta. ') + 'Punti in classifica +' + POINTS[place - 1] + '.' + note;
    S.msg = 'Ultima corsa ' + place + '° nel ' + lv.name + '.';
  } else {
    race.title = 'Vince ' + winner.name;
    race.note = 'Corsa vista dalla tribuna. Il ' + winner.num + ' ' + winner.name + ' di ' + winner.stable + ' taglia il traguardo per primo.';
    S.msg = 'Hai visto il ' + lv.name + '.';
  }
  race.bet = null;
  if (S.book && S.book.bets.length) {
    race.bet = settleBets(S.book, order.map(function (r) { return r.idx; }));
  } else if (S.book) {
    race.bet = { rows: [], won: 0, staked: 0, official: settleBets(S.book, order.map(function (r) { return r.idx; })).official };
  }
  S.book = null;
  race.done = true;
  race.results = order.map(function (r, i) { return { place: (i + 1) + '°', num: r.num, name: r.name, stable: r.stable, silk: r.silk, cap: r.cap, time: r.finished ? fmtTime(r.time) : 'n.d.', isPlayer: r.isPlayer, backed: r.backed }; });
  crowdLevel(place === 1 ? 0.12 : 0.05);
  setTimeout(crowdStop, 2500);
  if (place === 1) sfx('fanfare'); else if (prize > 0 || (race.bet && race.bet.won > 0)) sfx('coin');
  save(); renderTop(); updateRace(); showResults();
}

function careersHTML() {
  var d = readSlots(), f = S.form;
  var slots = '';
  for (var i = 0; i < NSLOTS; i++) {
    var sl = d.slots[i], cur = i === S.slot;
    if (sl && sl.data) {
      var x = sl.data, dt = new Date(sl.savedAt);
      var when = dt.toLocaleDateString('it-IT') + ' alle ' + dt.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      slots += '<div class="panel" style="padding:16px;display:flex;gap:14px;align-items:center;border-color:' + (cur ? '#D4AF37' : 'var(--line)') + '">' +
        '<span class="sw" style="width:34px;height:34px;border-width:6px;background:' + (x.silk || SILKS[0]) + ';border-color:' + (x.cap || CAPS[0]) + '"></span>' +
        '<div style="flex:1;min-width:0"><div class="cap">SLOT ' + (i + 1) + (cur ? ', IN USO' : '') + '</div><div class="serif" style="font-size:22px">' + esc(x.stableName || 'La tua scuderia') + '</div>' +
        '<div class="muted" style="font-size:13px">' + (DIFFS[x.difficulty] || DIFFS.normale).label + ', settimana ' + x.week + ', cassa ' + euro(x.money) + ', ' + ((x.career && x.career.wins) || 0) + ' vittorie</div>' +
        '<div class="muted" style="font-size:12px">Salvata il ' + when + '</div></div>' +
        (cur ? '<button class="primary" data-act="saveNow" style="min-height:44px;padding:0 16px">Salva ora</button><button data-act="deleteSlot" data-arg="' + i + '" style="min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #6B3A2F;background:transparent;color:#F0B4A6">Cancella</button>' :
          '<button class="primary" data-act="loadSlot" data-arg="' + i + '" style="min-height:44px;padding:0 16px">Carica</button><button data-act="deleteSlot" data-arg="' + i + '" style="min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #6B3A2F;background:transparent;color:#F0B4A6">Cancella</button>') +
        '</div>';
    } else {
      slots += '<div class="panel" style="padding:16px;display:flex;gap:14px;align-items:center;border-style:dashed"><div style="flex:1"><div class="cap">SLOT ' + (i + 1) + '</div><div class="muted" style="font-size:15px">Vuoto</div></div></div>';
    }

  var diffCards = Object.keys(DIFFS).map(function (k) {
    var x = DIFFS[k];
    return '<button class="sel dark' + (f.difficulty === k ? ' on' : '') + '" data-act="fDiff" data-arg="' + k + '" style="padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-height:44px"><span style="font-size:15px;font-weight:600">' + x.label + '</span><span class="muted" style="font-size:12px;line-height:1.35">' + x.desc + '</span></button>';
  }).join('');
  var slotBtns = '';
  for (var k = 0; k < NSLOTS; k++) slotBtns += '<button class="sel dark' + (f.slot === k ? ' on' : '') + '" data-act="fSlot" data-arg="' + k + '" style="flex:1;min-height:44px;font-size:14px;text-align:center">Slot ' + (k + 1) + (d.slots[k] ? ' (occupato)' : '') + '</button>';
  return '<div style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:16px">' +
    '<div class="scroll" style="display:flex;flex-direction:column;gap:12px">' +
    '<h2 class="serif" style="margin:0;font-size:30px">Le tue carriere</h2>' +
    '<div class="muted" style="font-size:13px;line-height:1.45">Il gioco salva da solo dopo ogni azione nello slot in uso. I salvataggi restano in questo browser. Per spostarli su un altro dispositivo esporta il file e importalo dall’altra parte.</div>' + slots +
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="act" data-act="exportSave" style="min-height:52px;flex:1"><span style="font-size:15px;font-weight:600">Esporta il salvataggio</span><span class="muted" style="font-size:12px">Scarica un file della carriera in uso</span></button>' +
    '<button class="act" data-act="importClick" style="min-height:52px;flex:1"><span style="font-size:15px;font-weight:600">Importa un salvataggio</span><span class="muted" style="font-size:12px">Lo carica nello slot scelto a destra</span></button>' +
    '<input type="file" id="importFile" accept=".json,application/json" style="display:none"></div>' +
    '<div style="font-size:14px;color:var(--note);min-height:20px">' + esc(S.msg || '') + '</div></div>' +
    '<div class="panel scroll" style="padding:20px;display:flex;flex-direction:column;gap:12px">' +
    '<h3 class="serif" style="margin:0;font-size:26px">Nuova carriera</h3>' +
    '<label for="fName" style="font-size:13px;font-weight:600">Nome della scuderia</label>' +
    '<input id="fName" type="text" maxlength="28" value="' + esc(f.name) + '" placeholder="Scuderia ..." style="min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit">' +
    '<div style="font-size:13px;font-weight:600">Difficoltà</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">' + diffCards + '</div>' +
    '<div style="display:flex;gap:24px"><div><div style="font-size:13px;font-weight:600;margin-bottom:6px">Giubba</div><div style="display:flex;gap:6px">' + swatches(SILKS, f.silk, 'fSilk') + '</div></div>' +
    '<div><div style="font-size:13px;font-weight:600;margin-bottom:6px">Cap</div><div style="display:flex;gap:6px">' + swatches(CAPS, f.cap, 'fCap') + '</div></div></div>' +
    '<div style="font-size:13px;font-weight:600">Salva nello</div><div style="display:flex;gap:8px">' + slotBtns + '</div>' +
    '<button class="primary" data-act="createCareer" style="min-height:52px;border-radius:10px;font-size:17px">Inizia la carriera</button></div></div>';
}

function bettingHTML() {
  var races = LEVELS.map(function (l) {
    var seen = S.watched[l.id] === S.week, open = S.book && S.book.lvl === l.id && S.book.week === S.week;

      '<div><div style="font-size:16px;font-weight:600">' + l.name + '</div><div class="muted" style="font-size:13px">' + l.track + ', ' + l.dist + ' m, montepremi ' + euro(l.prize) + '</div></div>' +
      '<button class="primary" data-act="watch" data-arg="' + l.id + '" style="min-height:44px;font-size:14px"' + (seen ? ' disabled' : '') + '>' + (seen ? 'Già corsa' : (open ? 'Torna al paddock' : 'Guarda e scommetti')) + '</button></div>';
  }).join('');
  var log = S.betLog.length ? S.betLog.slice(0, 12).map(function (x) {
    return '<div style="display:grid;grid-template-columns:minmax(0,1fr) 70px 80px;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px"><span>' + esc(x.label) + '<span class="muted" style="display:block;font-size:12px">' + esc(x.race) + ', settimana ' + x.week + '</span></span><span class="mono muted" style="text-align:right">' + euro(x.amount) + '</span><span class="mono" style="text-align:right;color:' + (x.pay > 0 ? '#86C98A' : '#F0B4A6') + '">' + (x.pay > 0 ? euro(x.pay) : 'perso') + '</span></div>';
  }).join('') : '<div class="muted" style="font-size:14px">Nessuna giocata ancora.</div>';

    '<div class="scroll" style="display:flex;flex-direction:column;gap:10px"><h2 class="serif" style="margin:0;font-size:30px">Corse in programma</h2>' +
    '<div class="muted" style="font-size:13px">Guarda le corse dalla tribuna e scommetti, anche nei livelli che non hai ancora sbloccato. Ogni corsa si disputa una volta a settimana. Sulle corse dove corri tu scommetti dal paddock, dopo l’iscrizione.</div>' + races +
    '<div class="panel" style="padding:16px;display:flex;flex-direction:column;gap:6px"><h3 style="margin:0;font-size:16px">Come funzionano le scommesse</h3>' +
    '<div class="muted" style="font-size:13px;line-height:1.5">Le quote sono a totalizzatore, come negli ippodromi italiani. Tutte le puntate finiscono in un monte, il banco trattiene il ' + Math.round(TAKE.V * 100) + ' per cento su vincente e piazzato, il ' + Math.round(TAKE.A * 100) + ' sull’accoppiata e il ' + Math.round(TAKE.T * 100) + ' sulla tris, il resto va diviso tra chi vince. Le quote cambiano anche con le tue puntate e diventano ufficiali all’arrivo. La quota comprende la posta, quindi 3,50 vuol dire che 10 euro ne rendono 35.</div>' +
    '<div style="font-size:13px;line-height:1.6"><b>Vincente</b> il tuo cavallo arriva primo. <b>Piazzato</b> arriva primo o secondo, come nelle corse italiane fino a 7 partenti. <b>Accoppiata</b> indovini i primi due in qualsiasi ordine. <b>Tris</b> indovini i primi tre nell’ordine esatto.</div></div></div>' +
    '<div class="panel scroll" style="padding:20px;display:flex;flex-direction:column;gap:10px"><h3 class="serif" style="margin:0;font-size:24px">Le tue giocate</h3>' +

    log + '</div></div>';
}

function paddockHTML() {
  var b = S.book;
  if (!b) { S.screen = 'races'; return racesHTML(); }
  var L = LEVELS[b.lvl - 1], sl = S.slip, run = b.mode === 'run';
  var rows = b.runners.map(function (r, i) {
    var at = sl.sel.indexOf(i);
    var badge = at >= 0 ? (sl.type === 'T' ? (at + 1) + '°' : 'X') : '';
    return '<button class="sel' + (at >= 0 ? ' on' : '') + '" data-act="pick" data-arg="' + i + '" style="display:grid;grid-template-columns:36px 22px minmax(0,1fr) 76px 76px 34px;gap:10px;align-items:center;padding:7px 12px;min-height:54px">' +
      '<span class="serif" style="width:32px;height:32px;border-radius:6px;background:#F4F1E8;color:#1A1A1A;display:flex;align-items:center;justify-content:center;font-size:18px">' + r.num + '</span>' +
      '<span class="sw" style="background:' + r.silk + ';border-color:' + r.cap + '"></span>' +
      '<span style="min-width:0"><span style="font-size:15px;font-weight:600">' + esc(r.name) + (r.isPlayer ? ' <span class="gold" style="font-size:11px;letter-spacing:.08em">TUO</span>' : '') + '</span>' +
      '<span class="muted" style="display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.stable) + ', fantino ' + esc(r.jockey) + ', forma ' + r.form + '</span></span>' +
      '<span class="mono gold" style="font-size:17px;text-align:right">' + oddsV(b, i).toFixed(2) + '</span>' +
      '<span class="mono" style="font-size:15px;text-align:right">' + oddsP(b, i).toFixed(2) + '</span>' +
      '<span class="gold" style="font-weight:600;text-align:center">' + badge + '</span></button>';
  }).join('');
  var types = ['V', 'P', 'A', 'T'].map(function (t) { return '<button class="tab' + (sl.type === t ? ' on' : '') + '" data-act="betType" data-arg="' + t + '" style="flex:1">' + BET_NAMES[t] + '</button>'; }).join('');
  var hints = { V: 'Scegli il cavallo che vince.', P: 'Scegli un cavallo che arriva primo o secondo.', A: 'Scegli due cavalli per i primi due posti, in qualsiasi ordine.', T: 'Scegli tre cavalli nell’ordine d’arrivo: primo, secondo, terzo.' };
  var q = oddsFor(b, sl.type, sl.sel);
  var chips = [2, 5, 10, 25, 50, 100, 250, 500].map(function (v) { return '<button class="tab' + (sl.amount === v ? ' on' : '') + '" data-act="amount" data-arg="' + v + '" style="min-height:40px;padding:0 10px;font-size:14px">' + v + '</button>'; }).join('');
  var slip = b.bets.length ? b.bets.map(function (bet, k) {
    var qq = oddsFor(b, bet.type, bet.sel);
    return '<div style="display:grid;grid-template-columns:minmax(0,1fr) 64px 60px 40px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px"><span>' + betLabel(b, bet) + '</span><span class="mono" style="text-align:right">' + euro(bet.amount) + '</span><span class="mono gold" style="text-align:right">' + qq.toFixed(2) + '</span>' +
      '<button data-act="cancelBet" data-arg="' + k + '" aria-label="Annulla giocata" style="min-height:32px;border-radius:6px;border:1px solid #6B3A2F;background:transparent;color:#F0B4A6;font-size:16px">×</button></div>';
  }).join('') : '<div class="muted" style="font-size:13px">Nessuna giocata. Puoi anche partire senza scommettere.</div>';
  var tot = sum(b.bets.map(function (x) { return x.amount; }));
  var startLabel = run ? 'Vai al cancello' : 'Guarda la corsa';
  var cost = run ? 'Iscrizione e fantino ' + euro(L.fee + JOCKEYS[S.jockey].cost) + ', li paghi alla partenza.' : 'Guardi la corsa dalla tribuna.';
  return '<div style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px">' +
    '<div style="display:flex;flex-direction:column;gap:8px;min-height:0">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 class="serif" style="margin:0;font-size:28px">Paddock, ' + L.name + '</h2><span class="muted" style="font-size:13px">' + L.dist + ' m, ' + L.track + '</span></div>' +
    '<div style="display:grid;grid-template-columns:36px 22px minmax(0,1fr) 76px 76px 34px;gap:10px;padding:0 13px" class="cap"><span>N°</span><span></span><span>CAVALLO</span><span style="text-align:right">VINCENTE</span><span style="text-align:right">PIAZZATO</span><span></span></div>' +
    '<div class="scroll" style="display:flex;flex-direction:column;gap:6px">' + rows + '</div>' +
    '<div class="muted" style="font-size:12px">Lavagna del totalizzatore. Quote provvisorie, cambiano con le puntate e diventano definitive all’arrivo. La quota piazzato è indicativa.</div>' +
    '<div style="font-size:14px;color:var(--note);min-height:20px">' + esc(S.msg || '') + '</div></div>' +
    '<div class="panel scroll" style="padding:18px;display:flex;flex-direction:column;gap:10px">' +
    '<h3 class="serif" style="margin:0;font-size:24px">Sportello scommesse</h3>' +
    '<div style="display:flex;gap:6px">' + types + '</div>' +
    '<div class="muted" style="font-size:13px">' + hints[sl.type] + '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:15px"><span>' + (sl.sel.length ? sl.sel.map(function (i) { return 'N° ' + b.runners[i].num; }).join(sl.type === 'T' ? ' > ' : ' + ') : 'Tocca i cavalli a sinistra') + '</span><span class="mono gold" style="font-size:20px">' + (q ? q.toFixed(2) : '') + '</span></div>' +
    '<div style="display:flex;gap:5px;flex-wrap:wrap">' + chips + '</div>' +
    '<div style="display:flex;justify-content:space-between;font-size:14px"><span>Posta ' + euro(sl.amount) + '</span><span class="muted">' + (q ? 'Vincita possibile ' + euro(sl.amount * q) : '') + '</span></div>' +
    '<button class="primary" data-act="placeBet" style="min-height:48px;font-size:16px"' + (q && S.money >= sl.amount ? '' : ' disabled') + '>Gioca ' + euro(sl.amount) + '</button>' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><h4 style="margin:0;font-size:15px">La tua schedina</h4><span class="mono muted" style="font-size:13px">' + euro(tot) + '</span></div>' + slip +
    '<div class="muted" style="font-size:12px;margin-top:auto">' + cost + '</div>' +
    '<div style="display:flex;gap:8px"><button data-act="leavePaddock" style="flex:0 0 120px;min-height:52px;border-radius:10px;border:1px solid var(--line2);background:transparent;font-size:15px">Indietro</button>' +
    '<button class="primary" data-act="start" style="flex:1;min-height:52px;border-radius:10px;font-size:17px">' + startLabel + '</button></div></div></div>';
}

var ICONS = {
  carota: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M8 28 L22 10 C25 7 29 9 28 13 Z" fill="#E8742A" stroke="#A8481A" stroke-width="1.2"/><path d="M14 22l3 1M17 18l3 1M11 26l2 0.5" stroke="#A8481A" stroke-width="1"/><path d="M24 10 C24 4 28 2 30 3 C28 5 27 7 26 10 M25 11 C29 8 32 9 33 10 C30 11 28 12 26 12" fill="#4F9A38"/></svg>',
  zolletta: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M6 12 L17 6 L28 12 L28 24 L17 30 L6 24 Z" fill="#FBFBF7" stroke="#A9A9A2" stroke-width="1.2"/><path d="M6 12 L17 18 L28 12 M17 18 V30" fill="none" stroke="#C9C9C2" stroke-width="1.2"/></svg>',
  ferro: '<svg width="34" height="34" viewBox="0 0 34 34"><path d="M8 28 V15 a9 9 0 0 1 18 0 V28 H22 V15 a5 5 0 0 0 -10 0 V28 Z" fill="#E2B93B" stroke="#8C6A12" stroke-width="1.2"/><circle cx="10" cy="20" r="1" fill="#8C6A12"/><circle cx="24" cy="20" r="1" fill="#8C6A12"/><circle cx="17" cy="9" r="1" fill="#8C6A12"/></svg>'
};
function raceHTML() {
  var paces = ['Risparmia', 'Galoppo', 'Sprint'].map(function (l, i) { return '<button class="pace" id="pace' + i + '" data-act="pace" data-arg="' + i + '">' + l + '<small>tasto ' + (i + 1) + '</small></button>'; }).join('');
  return '<div style="display:flex;flex-direction:column;gap:12px">' +
    '<div id="view" style="position:relative;width:1240px;height:520px;overflow:hidden;border-radius:12px;background:#6E9A5A">' +
    '<div class="abs" id="gl" style="inset:0"></div>' +
    '<div class="abs" id="radar" style="top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:rgba(15,42,33,.82)"></div>' +
    '<div class="abs" id="tvbug" style="left:14px;right:14px;bottom:12px;display:flex;align-items:stretch;gap:0;pointer-events:none;font-size:13px"></div>' +
    '<div class="abs" id="overlay" style="inset:0;pointer-events:none"></div>' +
    '<div class="abs" id="results" style="inset:0;display:none"></div></div>' +
    '<div style="height:168px;display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:14px">' +
    '<div class="panel" style="padding:14px 16px;display:flex;flex-direction:column;gap:6px"><div class="cap" id="hCap">POSIZIONE</div>' +
    '<div class="serif gold" style="font-size:48px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span id="hPlace">1°</span><span class="muted" id="hOf" style="font-size:22px"> su 6</span></div>' +
    '<div class="mono" style="display:flex;justify-content:space-between;font-size:15px"><span id="hTime">0:00.0</span><span><span id="hKmh">0</span> km/h</span></div>' +
    '<div class="muted" style="font-size:13px">Mancano <span id="hLeft">0</span> m</div></div>' +
    '<div class="panel" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">' +
    '<div style="display:flex;align-items:center;gap:12px"><div style="font-size:13px;width:90px">Fiato</div><div class="bar" style="flex:1;height:14px;border-radius:7px"><div id="hStam" style="width:100%;background:#86C98A"></div></div><div class="mono" id="hStamN" style="font-size:13px;width:36px;text-align:right">100</div></div>' +
    '<div id="mini" style="position:relative;height:18px;border-radius:9px;background:var(--bg)"></div>' +
    '<div style="display:flex;gap:8px">' + paces +
    '<button class="lanebtn" data-act="laneLeft" aria-label="Sposta a sinistra"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>' +
    '<button class="pace" id="camBtn" data-act="camera" style="flex:0 0 112px">Regia TV<small>camera, tasto C</small></button>' +
    '<button class="lanebtn" data-act="laneRight" aria-label="Sposta a destra"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>' +
    '<div class="muted" id="hPower" style="font-size:12px"></div></div>' +
    '<div class="panel" id="live" style="padding:12px 14px;display:flex;flex-direction:column;gap:3px"></div></div></div>';
}

function updateRace() {
  var race = S.race; if (!race || S.screen !== 'race') return;
  var me = racePlayer(race), focus = raceFocus(race);
  var radarEl = document.getElementById('radar');
  if (me && race.items.length) {
    var rad = '<span style="font-size:12px;color:#B9C4B5;margin-right:4px">Davanti a te</span>';
    for (var ln = 0; ln < 6; ln++) {
      var nx = null;
      race.items.forEach(function (it) { if (!it.taken && it.lane === ln && it.m > me.pos && it.m < me.pos + 160 && (!nx || it.m < nx.m)) nx = it; });
      var mine = me.lane === ln;
      rad += '<div style="width:62px;height:52px;border-radius:8px;border:2px solid ' + (mine ? '#D4AF37' : '#2F6A50') + ';background:' + (mine ? 'rgba(212,175,55,.18)' : 'rgba(0,0,0,.15)') + ';display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px">' +
        (nx ? '<div style="transform:scale(.7);height:26px;margin-top:-4px">' + ICONS[nx.kind] + '</div><div class="mono">' + Math.ceil(nx.m - me.pos) + ' m</div>' : '<div class="muted">corsia ' + (ln + 1) + '</div>') + '</div>';
    }
    radarEl.innerHTML = rad; radarEl.style.display = 'flex';
  } else if (race.spectator) {
    radarEl.innerHTML = '<span style="font-size:13px">Dalla tribuna. Segui il cavallo in testa, tasto C per la telecamera.</span>'; radarEl.style.display = 'flex';
  } else radarEl.style.display = 'none';

  var ov = '';
  if (!race.done && race.t < race.toastUntil) ov += '<div class="abs" style="top:72px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;background:rgba(15,42,33,.92);font-size:16px;font-weight:600;border:1px solid #D4AF37">' + race.toast + '</div>';
  if (race.count > 0) {
    var ct = Math.ceil(race.count) > 3 ? 'Al cancello' : String(Math.max(1, Math.ceil(race.count)));
    ov += '<div class="abs" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(15,42,33,.35)"><div class="serif" style="font-size:120px;color:#FAFAF6;text-shadow:0 4px 16px rgba(0,0,0,.5)">' + ct + '</div>' +
      '<div style="padding:6px 14px;border-radius:8px;background:rgba(15,42,33,.85);font-size:15px">' + LEVELS[race.lvl - 1].name + ', ' + race.dist + ' m</div></div>';
  }
  document.getElementById('overlay').innerHTML = ov;

  var order = orderOf(race);
  var left = Math.max(0, Math.ceil(race.dist - order[0].pos));
  var tick = order.slice(0, 6).map(function (r, i) {
    var hi = r.isPlayer || r.backed;
    return '<span style="display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-left:1px solid rgba(255,255,255,.12);' + (hi ? 'color:#F0CF62;font-weight:600' : '') + '"><b class="mono" style="color:#D4AF37">' + (i + 1) + '</b><span style="width:11px;height:11px;border-radius:2px;background:' + r.silk + ';border:2px solid ' + r.cap + '"></span>' + r.num + ' ' + esc(r.name.split(' ')[0]) + '</span>';
  }).join('');
  document.getElementById('tvbug').innerHTML = race.done ? '' :
    '<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:#B3261E;color:#fff;font-weight:700;letter-spacing:.06em;border-radius:6px 0 0 6px"><span style="width:8px;height:8px;border-radius:50%;background:#fff"></span>LIVE</div>' +
    '<div style="display:flex;align-items:center;gap:10px;padding:7px 12px;background:rgba(15,42,33,.92);border-right:1px solid rgba(255,255,255,.12)"><span class="serif" style="font-size:15px">' + LEVELS[race.lvl - 1].name + '</span><span class="mono gold">' + (race.count > 0 ? race.dist + ' m' : (left > 0 ? left + ' m all’arrivo' : 'ARRIVO')) + '</span></div>' +
    '<div style="flex:1;display:flex;align-items:center;overflow:hidden;white-space:nowrap;padding:7px 4px;background:rgba(15,42,33,.82);border-radius:0 6px 6px 0">' + tick + '</div>';
  if (me) {
    document.getElementById('hCap').textContent = 'POSIZIONE';
    document.getElementById('hPlace').textContent = (order.indexOf(me) + 1) + '°';
    document.getElementById('hOf').textContent = ' su 6';
  } else {
    document.getElementById('hCap').textContent = 'IN TESTA, ' + order[0].name.toUpperCase();
    document.getElementById('hPlace').textContent = 'N° ' + order[0].num;
    document.getElementById('hOf').textContent = '';
  }
  document.getElementById('hTime').textContent = fmtTime(focus.finished ? focus.time : race.t);
  document.getElementById('hKmh').textContent = Math.round(focus.speed * 3.6);
  document.getElementById('hLeft').textContent = Math.max(0, Math.ceil(race.dist - focus.pos));
  var st = Math.round(focus.stam), sb = document.getElementById('hStam');
  sb.style.width = st + '%'; sb.style.background = focus.stam > 40 ? '#86C98A' : (focus.stam > 15 ? '#E9C46A' : '#E8735A');
  document.getElementById('hStamN').textContent = st;
  document.getElementById('mini').innerHTML = race.racers.map(function (r) {
    var hi = r.isPlayer || r.backed, s = hi ? 14 : 12;
    return '<div class="abs" style="top:' + (hi ? 2 : 3) + 'px;left:' + clamp(r.pos / race.dist * 100, 0, 100) + '%;width:' + s + 'px;height:' + s + 'px;margin-left:-6px;border-radius:50%;background:' + r.silk + ';border:2px solid ' + (hi ? '#D4AF37' : '#0F2A21') + '"></div>';
  }).join('');
  for (var i = 0; i < 3; i++) {
    var b = document.getElementById('pace' + i);
    b.classList.toggle('on', !!me && me.pace === i);
    b.disabled = race.done || !me || me.finished;
  }
  document.querySelectorAll('.lanebtn').forEach(function (x) { x.disabled = race.done || !me || me.finished; });
  var pw = [];
  if (race.t < race.boostUntil) pw.push('Zolletta attiva ' + Math.ceil((race.boostUntil - race.t) / 2) + ' s');
  if (race.t < race.ironUntil) pw.push('Ferro d’oro attivo ' + Math.ceil((race.ironUntil - race.t) / 2) + ' s');
  var hint = !me ? 'Guardi la corsa. I cavalli su cui hai puntato hanno il bordo dorato nella mappa e nell’ordine.' : (race.items.length ? 'Prendi carote, zollette e ferri d’oro cambiando corsia con le frecce sinistra e destra.' : 'Difficoltà Campione, nessun power up in pista.');
  document.getElementById('hPower').textContent = pw.length ? pw.join('. ') : hint;
  document.getElementById('live').innerHTML = order.map(function (r, i) {
    return '<div style="display:grid;grid-template-columns:22px 16px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;padding:2px 4px;border-radius:4px;background:' + (r.isPlayer ? 'var(--line)' : 'transparent') + ';box-shadow:' + (r.backed ? 'inset 0 0 0 1px #D4AF37' : 'none') + '">' +
      '<span class="mono gold">' + (i + 1) + '</span><span style="width:14px;height:14px;border-radius:3px;background:' + r.silk + ';border:2px solid ' + r.cap + '"></span>' +
      '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + r.num + '. ' + esc(r.name) + '</span></div>';
  }).join('');
}

function showResults() {
  var race = S.race, el = document.getElementById('results');
  var rows = race.results.map(function (r) {
    return '<div style="display:grid;grid-template-columns:34px 22px minmax(0,1fr) 70px;gap:8px;align-items:center;padding:6px 8px;border-top:1px solid var(--line);background:' + (r.isPlayer ? 'var(--line)' : 'transparent') + ';box-shadow:' + (r.backed ? 'inset 0 0 0 1px #D4AF37' : 'none') + ';font-size:14px">' +
      '<span class="serif gold" style="font-size:18px">' + r.place + '</span><span class="sw" style="background:' + r.silk + ';border-color:' + r.cap + '"></span>' +
      '<span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + r.num + '. ' + esc(r.name) + ' <span class="muted" style="font-size:12px">' + esc(r.stable) + '</span></span><span class="mono" style="text-align:right;font-size:13px">' + r.time + '</span></div>';
  }).join('');
  var bet = race.bet, betHTML = '';
  if (bet) {
    var tickets = bet.rows.length ? bet.rows.map(function (x) {
      return '<div style="display:grid;grid-template-columns:minmax(0,1fr) 60px 74px;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px"><span>' + x.label + '</span><span class="mono muted" style="text-align:right">' + euro(x.amount) + '</span><span class="mono" style="text-align:right;color:' + (x.pay > 0 ? '#86C98A' : '#F0B4A6') + '">' + (x.pay > 0 ? euro(x.pay) : 'perso') + '</span></div>';
    }).join('') : '<div class="muted" style="font-size:13px">Non avevi giocate su questa corsa.</div>';
    betHTML = '<div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div class="gold" style="font-size:12px;letter-spacing:.12em">TOTALIZZATORE</div>' +
      '<div class="muted" style="font-size:13px;line-height:1.5">' + bet.official + '</div>' +
      '<h3 style="margin:4px 0 0;font-size:15px">Le tue giocate</h3>' + tickets +
      (bet.rows.length ? '<div style="display:flex;justify-content:space-between;font-size:15px;padding-top:6px;border-top:1px solid var(--line)"><span>Giocato ' + euro(bet.staked) + '</span><span class="mono" style="color:' + (bet.won > 0 ? '#86C98A' : '#F0B4A6') + '">Vinto ' + euro(bet.won) + '</span></div>' : '') + '</div>';
  }
  el.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,42,33,.82)">' +
    '<div class="panel scroll" style="width:' + (bet ? 980 : 620) + 'px;max-height:500px;padding:22px;border-radius:14px;border-color:#D4AF37;display:flex;flex-direction:column;gap:10px">' +
    '<div style="display:grid;grid-template-columns:' + (bet ? 'minmax(0,1fr) minmax(0,1fr)' : '1fr') + ';gap:24px">' +
    '<div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div class="gold" style="font-size:12px;letter-spacing:.12em">ORDINE D’ARRIVO</div><h2 class="serif" style="margin:0;font-size:30px">' + esc(race.title) + '</h2>' +
    '<div style="font-size:14px;color:var(--note)">' + esc(race.note) + '</div><div>' + rows + '</div></div>' + betHTML + '</div>' +
    '<button class="primary" data-act="closeRace" style="min-height:50px;border-radius:10px;font-size:16px">' + (race.spectator ? 'Torna alle scommesse' : 'Torna in scuderia') + '</button></div></div>';
  el.style.display = 'block';
  var btn = el.querySelector('button'); if (btn) btn.focus();
}

function start3D() {
  var el = document.getElementById('gl');
  if (!el || S.screen !== 'race') return;
  if (!window.Race3D) { setTimeout(start3D, 100); return; }
  Race3D.start(el, function () { return S.race; });
  var b = document.getElementById('camBtn'); if (b) b.innerHTML = Race3D.cameraLabel() + '<small>camera, tasto C</small>';
}
function render() {
  var body = '';
  if (S.screen === 'stable') body = stableHTML();
  else if (S.screen === 'market') body = marketHTML();
  else if (S.screen === 'races') body = racesHTML();
  else if (S.screen === 'standings') body = standingsHTML();
  else if (S.screen === 'betting') body = bettingHTML();
  else if (S.screen === 'paddock') body = paddockHTML();
  else if (S.screen === 'careers') { if (!S.form) A.resetForm(); body = careersHTML(); }
  else if (S.screen === 'race') body = raceHTML();
  if (window.Race3D) Race3D.stop();
  app.innerHTML = topHTML() + body;
  if (S.screen === 'race') { start3D(); updateRace(); }
}

app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var f = A[b.getAttribute('data-act')];
  if (f) f(b.getAttribute('data-arg'));
});
app.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'importFile' && e.target.files && e.target.files[0]) importFile(e.target.files[0]);
});
document.addEventListener('keydown', function (e) {
  if (S.screen !== 'race' || !S.race) return;
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); steer(-1); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); steer(1); }
  else if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); }
  else if (k === '1') setPace(0);
  else if (k === '2') setPace(1);
  else if (k === '3') setPace(2);
  else if (k === 'c' || k === 'C') A.camera();
});

function fit() {
  var sc = Math.min(1, window.innerWidth / 1280, window.innerHeight / 840);
  var w = document.getElementById('wrap');
  w.style.transform = 'scale(' + sc + ')';
  w.style.marginBottom = (840 * sc - 840) + 'px';
}
window.addEventListener('resize', fit);
fit();
render();
setInterval(tick, 50);
</script>
</body>
</html>
