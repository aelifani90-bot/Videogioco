<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gran Galoppo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#0F2A21;--panel:#163A2D;--line:#24523F;--line2:#2F6A50;--btn:#1C4535;--text:#F3EEDF;--muted:#B9C4B5;--gold:#D4AF37;--warn:#F0B4A6;--ok:#86C98A;--note:#E9D9A6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
#wrap{width:1280px;height:840px;transform-origin:top center}
#app{width:1280px;height:840px;padding:20px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
button{font-family:inherit;color:var(--text);cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.mono{font-family:'IBM Plex Mono',monospace}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.cap{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.gold{color:var(--gold)}
.primary{border:0;border-radius:8px;background:var(--gold);color:#1C1606;font-weight:600}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:10px;text-align:left}
.sel.on{border-color:var(--gold);background:var(--line)}
.dark.sel{background:var(--bg)}
.dark.sel.on{background:var(--line)}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar>div{height:100%}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 20px}
.tab{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:15px;font-weight:600}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1C1606}
.act{min-height:64px;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--btn);text-align:left;display:flex;flex-direction:column;gap:3px}
.horsebox{border-radius:10px;background:#2C5A3F;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:15px}
th{padding:8px 6px;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.08em;text-align:left}
td{padding:12px 6px;border-top:1px solid var(--line)}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;border-width:3px;border-style:solid;vertical-align:middle}
.abs{position:absolute}
.pace{flex:1;min-height:48px;border-radius:8px;border:1px solid var(--line2);background:var(--btn);font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pace.on{background:var(--gold);border-color:var(--gold);color:#1C1606}
.pace small{font-size:11px;font-weight:500;opacity:.8}
.lanebtn{width:52px;min-height:48px;border-radius:8px;border:1px solid var(--line2);background:var(--btn);display:flex;align-items:center;justify-content:center}
.scroll{overflow-y:auto;min-height:0}
</style>
</head>
<body>
<div id="wrap"><div id="app"></div></div>

/* ---------- Cavallo in SVG ---------- */

  baio_scuro: { body: '#4E2D1C', shade: '#331C10', leg: '#17110D', legDark: '#0F0B08', mane: '#120D0A' },

  pezzato_sauro: { body: '#EFEAE2', shade: '#BDB3A6', leg: '#3A2A20', legDark: '#2A1E18', mane: '#8E3416', patch: '#9A4E22' }

function photoOf(h) { if (h.coat === 'sauro') return h.blaze ? 'img/sauro-lista.jpg' : 'img/sauro.jpg'; return PHOTOS[h.coat] || ''; }

var POSES = [
  { nf: [106, 68, 124, 86, 138, 94], ff: [100, 68, 116, 88, 126, 100], nh: [46, 66, 30, 86, 16, 94], fh: [52, 66, 40, 88, 28, 100], bob: 0 },
  { nf: [106, 68, 116, 88, 120, 102], ff: [100, 68, 104, 88, 100, 102], nh: [46, 66, 42, 88, 36, 102], fh: [52, 66, 56, 88, 54, 102], bob: -2 },
  { nf: [106, 68, 108, 86, 98, 96], ff: [100, 68, 96, 86, 88, 98], nh: [46, 66, 60, 86, 70, 96], fh: [52, 66, 66, 84, 78, 92], bob: -4 },
  { nf: [106, 68, 116, 88, 120, 102], ff: [100, 68, 104, 88, 100, 102], nh: [46, 66, 42, 88, 36, 102], fh: [52, 66, 56, 88, 54, 102], bob: -2 }
];
var STAND = { nf: [106, 68, 107, 88, 107, 104], ff: [100, 68, 100, 88, 100, 104], nh: [44, 66, 41, 88, 44, 104], fh: [52, 66, 54, 88, 57, 104], bob: 0 };
var TAIL_RUN = 'M30 44 C18 44 8 50 2 60 C10 58 16 56 22 54 C14 60 10 66 8 72 C18 64 24 58 30 52 Z';
var TAIL_STAND = 'M30 44 C22 48 20 60 22 76 C24 86 26 92 28 96 C30 86 30 76 31 66 C32 58 33 52 32 46 Z';
function legSVG(a, upper, lower, wUp, hoof) {

    s += '<path d="M82 33 L96 42 L92 49 L80 40 Z" fill="#F4F1EA" stroke="#C9C4B8" stroke-width="0.5"/><path d="M91 42 L98 43 L95 53 L88 51 Z" fill="#151515"/>';
    s += '<path d="M70 32 C74 21 89 15 102 19 L107 25 C97 27 86 32 78 39 Z" fill="' + o.silk + '"/>';

/* ---------- Carriera ---------- */
function makeHorse(id, base) {
  return {
    id: id, name: pick(NAMES), coat: pick(COATS), blaze: Math.random() < 0.4,
    vel: clamp(base + ri(-7, 7), 15, 95), res: clamp(base + ri(-7, 7), 15, 95), acc: clamp(base + ri(-7, 7), 15, 95),
    energy: 100, morale: 60, trained: false, raced: false, cared: false, starts: 0, wins: 0, earnings: 0, form: []
  };
}
function genMarket(unlocked) {
  var list = [];
  for (var i = 0; i < 4; i++) list.push(makeHorse('m' + i, clamp(26 + unlocked * 8 + ri(-10, 10), 20, 85)));
  return list;
}
function freshCareer() {
  var starter = makeHorse(1, 38);
  starter.name = 'Vento di Maremma'; starter.coat = 'sauro'; starter.blaze = true;
  var stables = { me: 0 }, swins = { me: 0 };
  RIVALS.forEach(function (r) { stables[r.id] = 0; swins[r.id] = 0; });
  return { money: 6000, week: 1, nid: 2, horses: [starter], selId: 1, market: genMarket(1), unlocked: 1, best: {}, records: {}, stables: stables, swins: swins, career: { starts: 0, wins: 0, earn: 0 }, silk: SILKS[0], cap: CAPS[0], difficulty: 'normale' };
}
var SAVE_KEYS = ['money', 'week', 'nid', 'horses', 'selId', 'market', 'unlocked', 'best', 'records', 'stables', 'swins', 'career', 'silk', 'cap', 'difficulty'];

var S = Object.assign(freshCareer(), { screen: 'stable', selLevel: 1, jockey: 0, muted: false, race: null, msg: 'Benvenuto. Allena il tuo cavallo e iscrivilo alla prima corsa.' });
try {
  var raw = localStorage.getItem(KEY);
  if (raw) { var data = JSON.parse(raw); if (data && data.horses && data.horses.length) { Object.assign(S, data); S.msg = 'Bentornato in scuderia.'; } }
} catch (e) {}
function save() {
  try { var out = {}; SAVE_KEYS.forEach(function (k) { out[k] = S[k]; }); localStorage.setItem(KEY, JSON.stringify(out)); } catch (e) {}
}
function selHorse() { return S.horses.find(function (h) { return h.id === S.selId; }) || S.horses[0]; }

/* ---------- Audio ---------- */
var ac = null, nbuf = null, crowd = null;
function audio() {
  if (S.muted) return null;
  try {
    if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function tone(freq, dur, type, vol, when) {
  var a = audio(); if (!a) return;
  var t = a.currentTime + (when || 0);
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noiseBuffer() {
  var a = audio(); if (!a) return null;
  if (!nbuf) { var len = a.sampleRate * 2; nbuf = a.createBuffer(1, len, a.sampleRate); var d = nbuf.getChannelData(0); for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
  return nbuf;
}
function thump(when, vol) {
  var a = audio(), buf = noiseBuffer(); if (!a || !buf) return;
  var t = a.currentTime + when;
  var src = a.createBufferSource(); src.buffer = buf;
  var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t, Math.random()); src.stop(t + 0.12);
  tone(70 + Math.random() * 20, 0.08, 'sine', vol * 0.7, when);
}
function crowdStart() {
  var a = audio(), buf = noiseBuffer(); if (!a || !buf || crowd) return;
  var src = a.createBufferSource(); src.buffer = buf; src.loop = true;
  var f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 850; f.Q.value = 0.6;
  var g = a.createGain(); g.gain.value = 0.0001;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  g.gain.setTargetAtTime(0.02, a.currentTime, 0.5);
  crowd = { src: src, gain: g };
}
function crowdLevel(v) { if (crowd && ac) crowd.gain.gain.setTargetAtTime(v, ac.currentTime, 0.4); }
function crowdStop() {
  if (!crowd) return;
  try { var c = crowd; c.gain.gain.setTargetAtTime(0.0001, ac.currentTime, 0.5); setTimeout(function () { try { c.src.stop(); } catch (e) {} }, 2500); } catch (e) {}
  crowd = null;
}
function sfx(name) {
  if (name === 'beep') tone(660, 0.18, 'sine', 0.18);
  if (name === 'go') { tone(1046, 0.9, 'triangle', 0.22); tone(1568, 0.9, 'triangle', 0.12); tone(1046, 0.9, 'triangle', 0.18, 0.25); }
  if (name === 'power') [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.18, 'sine', 0.16, i * 0.06); });
  if (name === 'coin') { tone(988, 0.1, 'square', 0.08); tone(1319, 0.3, 'square', 0.08, 0.09); }
  if (name === 'fanfare') [392, 523, 659, 784, 659, 784].forEach(function (f, i) { tone(f, i === 5 ? 0.7 : 0.16, 'sawtooth', 0.07, i * 0.15); });
  if (name === 'call') [392, 523, 659, 784, 659, 523, 784].forEach(function (f, i) { tone(f, 0.14, 'square', 0.05, i * 0.13); });
  if (name === 'error') tone(180, 0.2, 'square', 0.06);
  if (name === 'click') tone(520, 0.05, 'sine', 0.06);
}

/* ---------- Azioni di gestione ---------- */
function updateHorse(id, fn) { S.horses = S.horses.map(function (h) { return h.id === id ? fn(Object.assign({}, h)) : h; }); }
function commit() { save(); render(); }
var A = {
  tab: function (t) { if (S.screen === 'race') return; sfx('click'); S.screen = t; S.msg = ''; render(); },
  mute: function () { S.muted = !S.muted; if (S.muted) crowdStop(); renderTop(); },
  selHorse: function (id) { sfx('click'); S.selId = +id; S.msg = ''; render(); },
  train: function (stat) {

function raceCheck() {
  var h = selHorse(), lv = LEVELS[S.selLevel - 1], j = JOCKEYS[S.jockey];
  if (!h) return 'Nessun cavallo in scuderia.';
  if (S.selLevel > S.unlocked) return 'Livello bloccato. Arriva nei primi tre del livello precedente.';
  if (h.raced) return h.name + ' ha già corso questa settimana.';
  if (h.energy < 40) return h.name + ' è troppo stanco. Serve energia 40.';
  if (S.money < lv.fee + j.cost) return 'Ti servono ' + euro(lv.fee + j.cost) + ' per iscrizione e fantino.';
  return '';
}

/* ---------- Gara ---------- */
function aiPace(x, race) {
  var frac = x.pos / race.dist;
  if (frac < 0.05) return 1;
  var remT = Math.max(0, race.dist - x.pos) / 16.5;
  var k = 1.45 - x.res / 100;
  if (x.strategy === 'attesa' && frac < 0.5) return x.stam > 75 ? 1 : 0;
  if (x.stam >= remT * 4.2 * k * x.nerve) return 2;
  if (x.strategy === 'fuga' && x.stam > 8) return 1;
  if (x.stam >= remT * 1.1 * k * x.nerve) return 1;
  return 0;
}
function stepRacer(x, race, dt) {
  if (x.finished) { x.pos += x.speed * dt; x.speed = Math.max(6, x.speed * 0.985); return; }
  var pace = x.isPlayer ? x.pace : aiPace(x, race);
  x.pace = pace;
  var top = 14 + x.vel * 0.055;
  var mult = pace === 0 ? 0.84 : (pace === 1 ? 0.94 : 1.05);
  var drain = pace === 0 ? -1.3 : (pace === 1 ? 1.1 : 4.2);
  if (drain > 0) drain = drain * (1.45 - x.res / 100) * x.save;
  if (x.isPlayer && race.t < race.ironUntil && drain > 0) drain = 0;
  x.stam = clamp(x.stam - drain * dt, 0, 100);
  if (x.stam <= 0.5 && pace > 0) mult *= 0.82;
  mult *= 0.97 + x.morale / 100 * 0.06;
  mult *= 0.92 + x.energy / 100 * 0.08;
  mult *= x.bonus;
  if (x.isPlayer && race.t < race.boostUntil) mult *= 1.12;
  var target = top * mult * (1 + (Math.random() - 0.5) * 0.02);
  var k = 0.35 + x.acc / 100 * 0.9;
  x.speed += (target - x.speed) * Math.min(1, k * dt);
  x.pos += x.speed * dt;
  if (!x.isPlayer && Math.random() < 0.004) x.lane = clamp(x.lane + (Math.random() < 0.5 ? -1 : 1), 0, 5);
  if (x.pos >= race.dist) { x.finished = true; x.time = race.t - (x.pos - race.dist) / Math.max(1, x.speed); }
}
function orderOf(race) {
  return race.racers.slice().sort(function (a, b) {
    if (a.finished && b.finished) return a.time - b.time;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.pos - a.pos;
  });
}
var lastCount = 4, lastStride = 0;
function startRace() {
  if (raceCheck()) { sfx('error'); return; }
  var lv = LEVELS[S.selLevel - 1], j = JOCKEYS[S.jockey], h = selHorse();
  var base = lv.rating + (DIFF[S.difficulty] || 0);
  var lanes = [0, 1, 2, 3, 4, 5].sort(function () { return Math.random() - 0.5; });
  var racers = [{
    id: 'me', isPlayer: true, name: h.name, stable: 'La tua scuderia', stableId: 'me', silk: S.silk, cap: S.cap,
    coat: h.coat, blaze: h.blaze, vel: h.vel, res: h.res, acc: h.acc, morale: h.morale, energy: h.energy,
    bonus: j.bonus, save: j.save, lane: lanes[0], pos: 0, speed: 0, stam: 100, pace: 1, phase: Math.random(), finished: false, time: 0, nerve: 1
  }];
  var used = {}; used[h.name] = true;
  RIVALS.forEach(function (r, i) {
    var o = makeHorse('r' + i, base + ri(-4, 4));
    while (used[o.name]) o.name = pick(NAMES);
    used[o.name] = true;
    racers.push({
      id: r.id, isPlayer: false, name: o.name, stable: r.name, stableId: r.id, silk: r.silk, cap: r.cap,
      coat: o.coat, blaze: o.blaze, vel: o.vel, res: o.res, acc: o.acc, morale: ri(50, 75), energy: ri(80, 100),
      bonus: 1, save: 1, lane: lanes[i + 1], pos: 0, speed: 0, stam: 100, pace: 1, phase: Math.random(), finished: false, time: 0,
      strategy: pick(['fuga', 'attesa', 'media', 'media']), nerve: 0.9 + Math.random() * 0.25
    });
  });
  racers.forEach(function (r, i) { r.num = String(i + 1); });
  var items = [];
  for (var m = 140; m < lv.dist - 80; m += ri(90, 150)) {
    var roll = Math.random();
    items.push({ m: m, lane: ri(0, 5), kind: roll < 0.45 ? 'carota' : (roll < 0.8 ? 'zolletta' : 'ferro'), taken: false });
  }
  updateHorse(h.id, function (x) { x.raced = true; return x; });
  S.money -= lv.fee + j.cost;
  S.race = { lvl: lv.id, dist: lv.dist, t: 0, count: 3.6, racers: racers, items: items, boostUntil: 0, ironUntil: 0, done: false, results: null, toast: '', toastUntil: 0, playerDone: false, playerDoneT: 0 };
  S.screen = 'race'; lastCount = 4;
  save(); sfx('call'); render();
}
function setPace(p) { var r = S.race; if (!r || r.done || r.racers[0].finished) return; r.racers[0].pace = p; updateRace(); }
function moveLane(d) { var r = S.race; if (!r || r.done || r.racers[0].finished) return; r.racers[0].lane = clamp(r.racers[0].lane + d, 0, 5); updateRace(); }

function tick() {
  var race = S.race;
  if (S.screen !== 'race' || !race || race.done) return;
  if (race.count > 0) {
    race.count -= 0.05;
    var c = Math.ceil(race.count);
    if (c !== lastCount && c <= 3) { lastCount = c; if (c > 0) sfx('beep'); }
    if (race.count <= 0) { sfx('go'); crowdStart(); }
    updateRace(); return;
  }
  var me = race.racers[0];
  var steps = race.playerDone ? 3 : 1;
  for (var n = 0; n < steps; n++) {
    race.t += DT;
    var prev = me.pos;
    race.racers.forEach(function (x) { stepRacer(x, race, DT); });
    race.items.forEach(function (it) {
      if (!it.taken && it.lane === me.lane && prev < it.m && me.pos >= it.m && !me.finished) {
        it.taken = true; sfx('power');
        if (it.kind === 'carota') { me.stam = Math.min(100, me.stam + 30); race.toast = 'Carota. Fiato +30'; }
        if (it.kind === 'zolletta') { race.boostUntil = race.t + 10; race.toast = 'Zolletta di zucchero. Scatto!'; }
        if (it.kind === 'ferro') { race.ironUntil = race.t + 15; race.toast = 'Ferro d’oro. Fiato illimitato'; }
        race.toastUntil = race.t + 4;
      }
    });
    if (me.finished && !race.playerDone) { race.playerDone = true; race.playerDoneT = race.t; crowdLevel(0.09); }
  }
  race.racers.forEach(function (r) { r.phase += 0.05 * (r.finished ? 1.6 : 2.4) * (0.4 + r.speed / 18); });
  var stride = Math.floor(me.phase);
  if (stride !== lastStride && !me.finished && me.speed > 2) {
    lastStride = stride;
    var per = 1 / (2.4 * (0.4 + me.speed / 18));
    thump(0, 0.22); thump(per * 0.14, 0.18); thump(per * 0.28, 0.26);
  }
  if (!race.playerDone) crowdLevel(0.015 + 0.06 * Math.pow(me.pos / race.dist, 2));
  var allDone = race.racers.every(function (r) { return r.finished; });
  if (allDone || (race.playerDone && race.t - race.playerDoneT > 40)) { finishRace(race); return; }
  updateRace();
}
function finishRace(race) {
  var lv = LEVELS[race.lvl - 1];
  var order = orderOf(race);
  var place = order.findIndex(function (r) { return r.isPlayer; }) + 1;
  var prize = Math.round(lv.prize * PRIZE_SHARE[place - 1]);
  order.forEach(function (r, i) { S.stables[r.stableId] = (S.stables[r.stableId] || 0) + POINTS[i]; if (i === 0) S.swins[r.stableId] = (S.swins[r.stableId] || 0) + 1; });
  updateHorse(S.selId, function (x) {
    x.energy = Math.max(0, x.energy - 35);
    x.morale = clamp(x.morale + (place === 1 ? 15 : place <= 3 ? 6 : -5), 0, 100);
    x.starts += 1; if (place === 1) x.wins += 1; x.earnings += prize;
    x.form = [place].concat(x.form || []).slice(0, 5); return x;
  });
  if (!S.best[lv.id] || place < S.best[lv.id]) S.best[lv.id] = place;
  var winner = order[0];
  if (winner.finished && (!S.records[lv.id] || winner.time < S.records[lv.id].time)) S.records[lv.id] = { time: winner.time, horse: winner.name };
  var note = '';
  if (place <= 3 && lv.id === S.unlocked && S.unlocked < LEVELS.length) { S.unlocked += 1; note = ' Hai sbloccato il livello ' + S.unlocked + '.'; }
  S.career = { starts: S.career.starts + 1, wins: S.career.wins + (place === 1 ? 1 : 0), earn: S.career.earn + prize };
  S.money += prize;
  race.done = true;
  race.results = order.map(function (r, i) { return { place: (i + 1) + '°', name: r.name, stable: r.stable, silk: r.silk, cap: r.cap, time: r.finished ? fmtTime(r.time) : 'n.d.', isPlayer: r.isPlayer }; });
  race.title = place === 1 ? 'Vittoria!' : place + '° posto';
  race.note = (prize > 0 ? 'Premio ' + euro(prize) + '. ' : 'Nessun premio questa volta. ') + 'Punti in classifica +' + POINTS[place - 1] + '.' + note;
  S.msg = 'Ultima corsa ' + place + '° nel ' + lv.name + '.';
  crowdLevel(place === 1 ? 0.12 : 0.05);
  setTimeout(crowdStop, 2500);
  if (place === 1) sfx('fanfare'); else if (prize > 0) sfx('coin');
  save(); renderTop(); updateRace(); showResults();
}

function updateRace() {
  var race = S.race; if (!race || S.screen !== 'race') return;
  var me = race.racers[0], cam = me.pos, px = cam * PX;
  document.getElementById('turf').style.backgroundPosition = (-(px % 240)) + 'px 0';
  document.getElementById('rail').style.backgroundPosition = (-(px % 40)) + 'px 0';
  document.getElementById('railNear').style.backgroundPosition = (-((px * 1.15) % 48)) + 'px 0';
  document.getElementById('hills').style.transform = 'translateX(' + (-((px * 0.12) % 1240)) + 'px)';
  document.getElementById('stands').style.transform = 'translateX(' + (-((px * 0.35) % 800)) + 'px)';
  var html = '';
  var m0 = Math.floor((cam - 60) / 100) * 100;
  for (var m = m0; m <= cam + 80; m += 100) {
    if (m > 0 && m < race.dist) {
      html += '<div class="abs" style="left:' + (NOSE_X + (m - cam) * PX - 20) + 'px;top:150px;width:40px;height:64px;display:flex;flex-direction:column;align-items:center">' +
        '<div class="mono" style="padding:2px 6px;background:#FAFAF6;color:#1C1C1C;font-size:12px;border:1px solid #333">' + (race.dist - m) + '</div>' +
        '<div style="width:4px;flex:1;background:repeating-linear-gradient(#C8452F 0 8px,#FAFAF6 8px 16px)"></div></div>';
    }
  }
  var sx = NOSE_X + (0 - cam) * PX - 10;
  if (sx > -80 && sx < 1260) {
    html += '<div class="abs" style="left:' + sx + 'px;top:226px;width:70px;height:290px;display:flex;flex-direction:column">';
    for (var g = 0; g < 6; g++) html += '<div style="height:44px;border:3px solid #E8E8E2;border-right-width:6px;background:rgba(40,48,58,.35)"></div>';
    html += '</div>';
  }
  var fx = NOSE_X + (race.dist - cam) * PX;
  if (fx > -60 && fx < 1300) {
    html += '<div class="abs" style="left:' + fx + 'px;top:226px;width:4px;height:294px;background:#FAFAF6"></div>' +
      '<div class="abs" style="left:' + (fx - 28) + 'px;top:120px;width:60px;height:100px;display:flex;flex-direction:column;align-items:center">' +
      '<div style="width:46px;height:46px;border-radius:23px;background:#C8452F;border:4px solid #FAFAF6;display:flex;align-items:center;justify-content:center;color:#FAFAF6;font-size:9px;font-weight:600">ARRIVO</div>' +
      '<div style="width:6px;flex:1;background:#FAFAF6"></div></div>';
  }
  race.items.forEach(function (it) {
    if (it.taken) return;
    var x = NOSE_X + (it.m - cam) * PX - 17;
    if (x > -40 && x < 1260) html += '<div class="abs" style="left:' + x + 'px;top:' + (262 + it.lane * 44 - 30) + 'px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))">' + ICONS[it.kind] + '</div>';
  });
  var racing = race.count <= 0;
  race.racers.slice().sort(function (a, b) { return a.lane - b.lane; }).forEach(function (r) {
    var size = Math.round(122 + r.lane * 11);
    var hh = size * 110 / 160;
    var x = Math.round(NOSE_X + (r.pos - cam) * PX - size * 0.97);
    if (x < -size || x > 1260) return;
    var y = Math.round(266 + r.lane * 44 - hh * 0.96);
    var frame = racing && r.speed > 1 ? Math.floor(r.phase * 4) % 4 : -1;
    html += '<div class="abs" style="left:' + x + 'px;top:' + y + 'px;width:' + size + 'px">';
    if (r.isPlayer) html += '<div class="abs" style="left:' + Math.round(size * 0.6) + 'px;top:-22px;display:flex;flex-direction:column;align-items:center"><div style="padding:1px 6px;border-radius:4px;background:#D4AF37;color:#1C1606;font-size:11px;font-weight:600">TU</div><svg width="12" height="7" viewBox="0 0 12 7"><path d="M0 0h12L6 7z" fill="#D4AF37"/></svg></div>';
    html += horseSVG({ coat: r.coat, blaze: r.blaze, silk: r.silk, cap: r.cap, num: r.num, frame: frame, size: size, jockey: true }) + '</div>';
  });
  document.getElementById('layer').innerHTML = html;

  var ov = '';
  if (!race.done && race.t < race.toastUntil) ov += '<div class="abs" style="top:16px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:999px;background:rgba(15,42,33,.92);font-size:16px;font-weight:600;border:1px solid #D4AF37">' + race.toast + '</div>';
  if (race.count > 0) {
    var ct = Math.ceil(race.count) > 3 ? 'Al cancello' : String(Math.max(1, Math.ceil(race.count)));
    ov += '<div class="abs" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(15,42,33,.35)"><div class="serif" style="font-size:120px;color:#FAFAF6;text-shadow:0 4px 16px rgba(0,0,0,.5)">' + ct + '</div>' +
      '<div style="padding:6px 14px;border-radius:8px;background:rgba(15,42,33,.85);font-size:15px">' + LEVELS[race.lvl - 1].name + ', ' + race.dist + ' m</div></div>';
  }
  document.getElementById('overlay').innerHTML = ov;

  var order = orderOf(race);
  document.getElementById('hPlace').textContent = (order.indexOf(me) + 1) + '°';
  document.getElementById('hTime').textContent = fmtTime(me.finished ? me.time : race.t);
  document.getElementById('hKmh').textContent = Math.round(me.speed * 3.6);
  document.getElementById('hLeft').textContent = Math.max(0, Math.ceil(race.dist - me.pos));
  var st = Math.round(me.stam), sb = document.getElementById('hStam');
  sb.style.width = st + '%'; sb.style.background = me.stam > 40 ? '#86C98A' : (me.stam > 15 ? '#E9C46A' : '#E8735A');
  document.getElementById('hStamN').textContent = st;
  document.getElementById('mini').innerHTML = race.racers.map(function (r) {
    var s = r.isPlayer ? 14 : 12;
    return '<div class="abs" style="top:' + (r.isPlayer ? 2 : 3) + 'px;left:' + clamp(r.pos / race.dist * 100, 0, 100) + '%;width:' + s + 'px;height:' + s + 'px;margin-left:-6px;border-radius:50%;background:' + r.silk + ';border:2px solid ' + (r.isPlayer ? '#D4AF37' : '#0F2A21') + '"></div>';
  }).join('');
  for (var i = 0; i < 3; i++) {
    var b = document.getElementById('pace' + i);
    b.classList.toggle('on', me.pace === i);
    b.disabled = race.done || me.finished;
  }
  var pw = [];
  if (race.t < race.boostUntil) pw.push('Zolletta attiva ' + Math.ceil((race.boostUntil - race.t) / 3) + ' s');
  if (race.t < race.ironUntil) pw.push('Ferro d’oro attivo ' + Math.ceil((race.ironUntil - race.t) / 3) + ' s');
  document.getElementById('hPower').textContent = pw.length ? pw.join('. ') : 'Prendi carote, zollette e ferri d’oro cambiando corsia con le frecce.';
  document.getElementById('live').innerHTML = order.map(function (r, i) {
    return '<div style="display:grid;grid-template-columns:22px 16px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;padding:2px 4px;border-radius:4px;background:' + (r.isPlayer ? 'var(--line)' : 'transparent') + '">' +
      '<span class="mono gold">' + (i + 1) + '</span><span style="width:14px;height:14px;border-radius:3px;background:' + r.silk + ';border:2px solid ' + r.cap + '"></span>' +
      '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.name) + '</span></div>';
  }).join('');
}

function showResults() {
  var race = S.race, el = document.getElementById('results');
  var rows = race.results.map(function (r) {
    return '<div style="display:grid;grid-template-columns:40px 26px minmax(0,1fr) 90px;gap:10px;align-items:center;padding:7px 8px;border-top:1px solid var(--line);background:' + (r.isPlayer ? 'var(--line)' : 'transparent') + ';font-size:15px">' +
      '<span class="serif gold" style="font-size:19px">' + r.place + '</span><span class="sw" style="background:' + r.silk + ';border-color:' + r.cap + '"></span>' +
      '<span>' + esc(r.name) + ' <span class="muted" style="font-size:13px">' + r.stable + '</span></span><span class="mono" style="text-align:right;font-size:14px">' + r.time + '</span></div>';
  }).join('');
  el.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,42,33,.82)">' +
    '<div class="panel" style="width:620px;padding:26px;border-radius:14px;border-color:#D4AF37;display:flex;flex-direction:column;gap:12px">' +
    '<div class="gold" style="font-size:12px;letter-spacing:.12em">ORDINE D’ARRIVO</div><h2 class="serif" style="margin:0;font-size:34px">' + race.title + '</h2>' +
    '<div style="font-size:15px;color:var(--note)">' + race.note + '</div><div>' + rows + '</div>' +
    '<button class="primary" data-act="closeRace" style="min-height:50px;border-radius:10px;font-size:16px">Torna in scuderia</button></div></div>';
  el.style.display = 'block';
  var btn = el.querySelector('button'); if (btn) btn.focus();
}

function render() {
  var body = '';
  if (S.screen === 'stable') body = stableHTML();
  else if (S.screen === 'market') body = marketHTML();
  else if (S.screen === 'races') body = racesHTML();
  else if (S.screen === 'standings') body = standingsHTML();
  else if (S.screen === 'race') body = raceHTML();
  app.innerHTML = topHTML() + body;
  if (S.screen === 'race') updateRace();
}

app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var f = A[b.getAttribute('data-act')];
  if (f) f(b.getAttribute('data-arg'));
});
document.addEventListener('keydown', function (e) {
  if (S.screen !== 'race' || !S.race) return;
  var k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); moveLane(-1); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); moveLane(1); }
  else if (k === '1') setPace(0);
  else if (k === '2') setPace(1);
  else if (k === '3') setPace(2);
});

function fit() {
  var sc = Math.min(1, window.innerWidth / 1280, window.innerHeight / 840);
  var w = document.getElementById('wrap');
  w.style.transform = 'scale(' + sc + ')';
  w.style.marginBottom = (840 * sc - 840) + 'px';
}
window.addEventListener('resize', fit);
fit();
render();
setInterval(tick, 50);
</script>
</body>
</html>
